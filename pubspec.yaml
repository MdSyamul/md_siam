name: md_siam
description: "Personal academic website for Md. Syamul Bashar."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/siam.jpeg
    - web/research/additive-manufacturing.svg
    - web/research/generative-design.svg
    - web/research/physical-ai.svg
    - web/research/thermal-comfort.svg
  fonts:
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Variable.ttf
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
