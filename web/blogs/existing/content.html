<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Existing — a brief reflection on mindfulness and the mind that meets the world."
    />
    <title>Existing</title>
    <style>
      :root {
        --ink: #172235;
        --muted: #5d6674;
        --gold: #a46b0f;
        --rule: #d9dee7;
        --paper: #fbfaf7;
        --page: #eef1f5;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: Cambria, Georgia, "Times New Roman", serif;
        line-height: 1.75;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(100%, 900px);
        margin: 0 auto;
        background: var(--paper);
        box-shadow: 0 18px 55px rgba(20, 34, 55, 0.14);
      }

      .opening-image {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        height: clamp(220px, 50vw, 420px);
        object-fit: cover;
        object-position: center 42%;
      }

      article {
        width: min(100% - 40px, 690px);
        margin: 0 auto;
        padding: clamp(46px, 8vw, 88px) 0 clamp(48px, 6vw, 64px);
      }

      header {
        text-align: center;
        margin-bottom: 54px;
      }

      h1 {
        margin: 0 0 10px;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.25rem, 7vw, 4.6rem);
        line-height: 1.08;
        letter-spacing: -0.035em;
      }

      .subtitle {
        margin: 0;
        color: var(--gold);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.15rem, 3vw, 1.55rem);
        font-style: italic;
        line-height: 1.45;
        text-align: center;
      }

      .ornament {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 40px 0;
        color: var(--gold);
        font-size: 0.86rem;
        line-height: 1;
      }

      .ornament::before,
      .ornament::after {
        content: "";
        height: 1px;
        flex: 1;
        background: var(--rule);
      }

      h2 {
        margin: 0 0 0.8em;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        line-height: 1.25;
        text-align: center;
      }

      .pull-quote {
        margin: 0 auto;
        color: var(--gold);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.35rem, 3vw, 1.75rem);
        font-style: italic;
        line-height: 1.55;
        text-align: center;
        text-wrap: balance;
      }

      @media (max-width: 600px) {
        .page {
          box-shadow: none;
        }

        article {
          width: min(100% - 32px, 690px);
        }
      }

      @media print {
        body,
        .page {
          background: #fff;
          box-shadow: none;
        }

        .opening-image {
          page-break-after: always;
        }

        article {
          width: 78%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <img
        class="opening-image"
        src="cover.png"
        alt="A meditating figure containing a luminous inner landscape"
      />
      <article>
        <header>
          <h1>Existing</h1>
          <p class="subtitle">Lightness</p>
        </header>

        <div class="ornament" aria-hidden="true">◆</div>

        <section aria-label="Reflection">
          <p class="pull-quote">
            “You are supposed to enjoy it. It's supposed to be a game. Nothing
            is a big deal.”—Chase Hughes
          </p>
        </section>
      </article>
    </main>
  </body>
</html>
