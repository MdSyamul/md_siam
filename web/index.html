<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Md. Syamul Bashar - Assistant Professor of Mechanical Engineering at Shahjalal University of Science and Technology.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Md. Syamul Bashar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Md. Syamul Bashar</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f7f2e8;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      color: #16242b;
      background:
        radial-gradient(circle at 85% 12%, rgba(59, 118, 138, 0.13), transparent 30%),
        linear-gradient(180deg, #f7f2e8, #fdf9f1);
      font-family: Arial, sans-serif;
      transition: opacity 220ms ease;
    }

    #app-loading.is-ready {
      opacity: 0;
      pointer-events: none;
    }

    .loading-card {
      width: min(360px, 100%);
      text-align: center;
    }

    .loading-mark {
      width: 44px;
      height: 44px;
      margin: 0 auto 22px;
      border: 3px solid #d8c8b0;
      border-top-color: #3b768a;
      border-radius: 50%;
      animation: loading-spin 850ms linear infinite;
    }

    .loading-name {
      margin: 0 0 8px;
      color: #0f2d3a;
      font-family: Georgia, serif;
      font-size: 24px;
      font-weight: 700;
    }

    .loading-message {
      margin: 0;
      color: #5a6a72;
      font-size: 14px;
      line-height: 1.5;
    }

    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-mark {
        animation-duration: 1.8s;
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-mark" aria-hidden="true"></div>
      <p class="loading-name">Md. Syamul Bashar</p>
      <p id="loading-message" class="loading-message">Loading the website&hellip;</p>
    </div>
  </div>
  <noscript>This website requires JavaScript to run.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
